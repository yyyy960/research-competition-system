server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cms_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql, classpath:ccf_data.sql
      continue-on-error: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: YzJtcy1zZWNyZXQta2V5LTIwMjUtY29tcGV0aXRpb24tcmVzZWFyY2gtbWFuYWdlbWVudC1zeXN0ZW0=
  expiration: 86400000

file:
  upload:
    path: ./uploads/

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
